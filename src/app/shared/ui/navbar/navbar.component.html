<header class="sticky top-0 z-30 border-b border-slate-200/60 bg-white/85 backdrop-blur">
  <div class="mx-auto flex max-w-6xl items-center justify-between px-4 py-4 sm:px-6 lg:px-8">
    <a routerLink="/" class="text-xl font-extrabold tracking-tight text-slate-900" (click)="closeMenu()">
      Angular<span class="text-sky-700">Craft</span>
    </a>

    <nav class="hidden items-center gap-2 md:flex">
      <a routerLink="/" routerLinkActive="nav-link-active" [routerLinkActiveOptions]="{ exact: true }" class="nav-link">Home</a>
      <a routerLink="/about" routerLinkActive="nav-link-active" class="nav-link">About</a>
      <a routerLink="/features" routerLinkActive="nav-link-active" class="nav-link">Features</a>
      <a routerLink="/contact" routerLinkActive="nav-link-active" class="nav-link">Contact</a>
    </nav>

    <button
      type="button"
      class="inline-flex items-center rounded-lg border border-slate-300 p-2 text-slate-700 transition hover:bg-slate-100 md:hidden"
      (click)="toggleMenu()"
      aria-label="Toggle menu"
    >
      <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="M4 6h16M4 12h16M4 18h16" />
      </svg>
    </button>
  </div>

  @if (isOpen()) {
    <nav class="border-t border-slate-200 bg-white px-4 pb-4 pt-2 md:hidden">
      <a routerLink="/" [routerLinkActiveOptions]="{ exact: true }" routerLinkActive="nav-link-active" class="nav-link block" (click)="closeMenu()">Home</a>
      <a routerLink="/about" routerLinkActive="nav-link-active" class="nav-link mt-1 block" (click)="closeMenu()">About</a>
      <a routerLink="/features" routerLinkActive="nav-link-active" class="nav-link mt-1 block" (click)="closeMenu()">Features</a>
      <a routerLink="/contact" routerLinkActive="nav-link-active" class="nav-link mt-1 block" (click)="closeMenu()">Contact</a>
    </nav>
  }
</header>
