<app-hero></app-hero>

<section class="section-wrap mt-16">
  <div class="mb-10 flex items-end justify-between gap-4">
    <h2 class="text-2xl font-bold tracking-tight text-slate-900 sm:text-3xl">Why teams start here</h2>
    <p class="max-w-xl text-sm text-slate-600 sm:text-base">A practical baseline designed for shipping quickly while keeping architecture clean.</p>
  </div>

  <div class="grid gap-6 md:grid-cols-2 xl:grid-cols-3">
    @for (item of highlights; track item.title) {
      <app-card [title]="item.title" [description]="item.description"></app-card>
    }
  </div>
</section>
