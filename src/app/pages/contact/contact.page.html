<section class="section-wrap pt-16">
  <div class="grid gap-10 lg:grid-cols-2">
    <div>
      <p class="text-sm font-semibold uppercase tracking-wide text-sky-700">Contact</p>
      <h1 class="mt-4 text-3xl font-bold tracking-tight text-slate-900 sm:text-4xl">Let’s build your next Angular experience</h1>
      <p class="mt-6 text-base leading-7 text-slate-600">
        This starter includes strong defaults and a deploy pipeline. Reach out if you want to adapt it for a real product roadmap.
      </p>
      <div class="mt-8">
        <app-button label="Back to Home" href="/"></app-button>
      </div>
    </div>

    <form class="card-surface space-y-5 p-8">
      <div>
        <label for="name" class="mb-2 block text-sm font-medium text-slate-700">Name</label>
        <input id="name" type="text" class="w-full rounded-xl border border-slate-300 px-4 py-2.5 text-sm text-slate-900 shadow-sm outline-none transition focus:border-sky-500 focus:ring-2 focus:ring-sky-200" placeholder="Jane Doe" />
      </div>
      <div>
        <label for="email" class="mb-2 block text-sm font-medium text-slate-700">Email</label>
        <input id="email" type="email" class="w-full rounded-xl border border-slate-300 px-4 py-2.5 text-sm text-slate-900 shadow-sm outline-none transition focus:border-sky-500 focus:ring-2 focus:ring-sky-200" placeholder="jane@example.com" />
      </div>
      <div>
        <label for="message" class="mb-2 block text-sm font-medium text-slate-700">Message</label>
        <textarea id="message" rows="4" class="w-full rounded-xl border border-slate-300 px-4 py-2.5 text-sm text-slate-900 shadow-sm outline-none transition focus:border-sky-500 focus:ring-2 focus:ring-sky-200" placeholder="Tell us about your project"></textarea>
      </div>
      <button type="button" class="btn-primary w-full">Send Message</button>
    </form>
  </div>
</section>
